<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Center · Canvas</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<aside class="sidebar">
  <a class="brand" href="/"><span class="logo">sc<span>·</span></span><span>Student Center<small>YOUR CANVAS, IN FOCUS</small></span></a>
  <div class="workspace"><span class="avatar">S</span><div>我的学习空间<small>UTS College · 本地实验版</small></div><span class="dot"></span></div>
  <p class="navlabel">学习中心</p>
  <nav id="nav"><button class="active" data-view="overview"><span>◉</span> 学习总览</button><button data-view="courses"><span>▦</span> 我的课程</button><button data-view="assignments"><span>◷</span> 作业与 DDL</button><button data-view="updates"><span>≋</span> 学生服务</button><button data-view="tools"><span>⌘</span> 工具工作台 <b id="toolBadge">—</b></button></nav>

</aside>
<main>
  <header><div class="breadcrumb">我的空间 <span>/</span> <b id="crumb">学习总览</b></div><div class="header-actions"><span id="connection" class="connection">正在连接 Canvas…</span><select id="timezone" aria-label="显示时区"><option value="Asia/Shanghai">中国时间 UTC+8</option><option value="Australia/Sydney">悉尼时间</option><option value="UTC">UTC</option></select><button id="refresh" class="button">↻ 刷新</button></div></header>

  <section id="content" aria-live="polite"><div class="loading"><span class="spinner"></span><h3>正在读取你的学习空间</h3><p>首次同步需要读取各课程的作业与提交记录。</p></div></section>
  <footer><span id="sync">等待首次同步</span><span>Student Center · 本地先验性实验</span></footer>
</main>
<dialog id="detail"><button class="close" id="closeDetail" aria-label="关闭详情">×</button><div id="detailBody"></div></dialog>
<script>window.SC_SESSION=__SESSION__;</script><script src="/static/app.js"></script>

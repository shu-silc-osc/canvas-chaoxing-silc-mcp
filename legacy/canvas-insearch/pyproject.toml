[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas-insearch-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mcp==1.26.0"]

[project.scripts]
canvas-insearch-mcp = "canvas_insearch_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
